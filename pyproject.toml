[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qc-checking-inventor-app"
version = "1.2.0"
description = "Quality control automation for fabrication drawing PDFs and BOM cross-referencing"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "MelvinjoseC", email = "165891174+MelvinjoseC@users.noreply.github.com"}
]
keywords = ["pdf", "cad", "bom", "quality-control", "inventor", "fabrication"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent"
]
dependencies = [
    "PyPDF2>=3.0.0",
    "pdfplumber>=0.10.0",
    "pdf2image>=1.16.0",
    "pytesseract>=0.3.10",
    "Pillow>=9.5.0",
    "pyspellchecker>=0.7.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    ".",
]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py310"]
